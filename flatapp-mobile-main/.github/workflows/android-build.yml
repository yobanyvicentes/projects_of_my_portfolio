name: Android build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore FlatApp.Mobile/FlatApp.Mobile/FlatApp.Mobile.csproj

      - name: Build Android Debug
        run: dotnet build FlatApp.Mobile/FlatApp.Mobile/FlatApp.Mobile.csproj -f net10.0-android -c Debug --no-restore
